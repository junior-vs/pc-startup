receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  # Traces → Elasticsearch (via Logstash ou direto)
  otlphttp/elasticsearch:
    endpoint: http://elasticsearch:9200
    tls:
      insecure: true

  # Métricas → Prometheus (pull)
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: app

  # Logs → stdout (útil para debug; substitua por exportador real em prod)
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/elasticsearch, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
      