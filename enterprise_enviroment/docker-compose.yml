services:

  # ─────────────────────────────────────────
  # sonarqube
  # ─────────────────────────────────────────

  sonarqube:
    image: ${SONARQUBE_IMAGE:-sonarqube:community}
    container_name: ${SONARQUBE_CONTAINER_NAME:-sonarqube}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://${SONAR_DB_HOST:-postgres}:${SONAR_DB_PORT:-5432}/${SONAR_DB_NAME:-appdb}
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:-dev}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-dev}
    #  - sonar.search.javaAdditionalOpts=-Dnode.store.allow_mmap=false
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ports:
      - "${SONARQUBE_PORT:-9000}:9000"
    networks:
      - devnet
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # ─────────────────────────────────────────
  # BANCOS DE DADOS
  # ─────────────────────────────────────────

  postgres:
    image: postgres:18.3
    container_name: dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: appdb
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devnet


  redis:
    image: redis:7-alpine
    container_name: dev-redis
    restart: unless-stopped
    command: redis-server --requirepass dev --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dev", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devnet

  mongodb:
    image: mongo:7
    container_name: dev-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: dev
      MONGO_INITDB_ROOT_PASSWORD: dev
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "mongodb://dev:dev@127.0.0.1:27017/admin", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devnet

  # ─────────────────────────────────────────
  # KEYCLOAK
  # ─────────────────────────────────────────

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: dev-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: dev-mem
      KC_HTTP_PORT: 8080
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    networks:
      - devnet

  # ─────────────────────────────────────────
  # MÉTRICAS: Prometheus + Grafana
  # ─────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: dev-prometheus
    restart: unless-stopped
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - devnet

  grafana:
    image: grafana/grafana:11.1.0
    container_name: dev-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    networks:
      - devnet

  # ─────────────────────────────────────────
  # OPENTELEMETRY COLLECTOR
  # ─────────────────────────────────────────

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: dev-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./config/otel/config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_PROM_PORT:-8889}:8889"
    depends_on:
      - prometheus
    networks:
      - devnet

  # ─────────────────────────────────────────
  # ELK STACK
  # ─────────────────────────────────────────

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    container_name: dev-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - devnet

  logstash:
    image: docker.elastic.co/logstash/logstash:8.14.0
    container_name: dev-logstash
    restart: unless-stopped
    volumes:
      - ./config/logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "${LOGSTASH_BEATS_PORT:-5044}:5044"
      - "${LOGSTASH_TCP_PORT:-5000}:5000"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - devnet

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.0
    container_name: dev-kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - devnet

# ─────────────────────────────────────────
# VOLUMES
# ─────────────────────────────────────────

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  grafana_data:
  elasticsearch_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
# ─────────────────────────────────────────
# REDE
# ─────────────────────────────────────────

networks:
  devnet:
    driver: bridge
